name: Backend CI/CD

on:
  pull_request:
    branches:
      - feature/backend-rl-training-framework
    paths:
      - "services/**"
      - "src/cathsim/**"
      - "data/vpp_assets/**"
      - "server/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches:
      - feature/backend-rl-training-framework
    paths:
      - "services/**"
      - "src/cathsim/**"
      - "data/vpp_assets/**"
      - "server/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy this branch revision after CI"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-production-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/simulation

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest numpy scipy pydantic fastapi httpx websockets \
            dm-control==1.0.14 mujoco==2.3.7 pympler trimesh

      - name: Compile backend
        run: python -m compileall -q services src/cathsim

      - name: Run backend contract tests
        env:
          MUJOCO_GL: osmesa
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q \
            tests/test_websocket.py::TestWebSocketHandlerUnit \
            tests/test_websocket.py::TestWebSocketProtocolExtensions \
            tests/test_navigation_engine.py \
            tests/test_frontend_contract.py \
            -k "not vpp_routes_are_selectable_without_mujoco"

  build:
    name: Build immutable simulation image
    needs: test
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}:sha-${GITHUB_SHA}"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile.simulation
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cathsim-simulation
          cache-to: type=gha,mode=max,scope=cathsim-simulation

  deploy:
    name: Deploy production
    needs: build
    if: >-
      github.repository == 'krischan-ai/cathsim-centerline' &&
      github.ref == 'refs/heads/feature/backend-rl-training-framework'
    runs-on:
      - self-hosted
      - linux
      - x64
      - cathsim-production
    timeout-minutes: 15
    environment:
      name: production
      url: http://192.168.1.107:9000/api/v1/health
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull immutable image as runner
        run: docker pull "${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

      - name: Deploy verified image
        env:
          CATHSIM_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          CATHSIM_IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          CATHSIM_EXPECTED_SHA: ${{ github.sha }}
          CATHSIM_RUN_ID: ${{ github.run_id }}
        run: >-
          sudo --non-interactive
          --preserve-env=CATHSIM_IMAGE,CATHSIM_IMAGE_DIGEST,CATHSIM_EXPECTED_SHA,CATHSIM_RUN_ID
          /usr/local/sbin/cathsim-deploy

      - name: Publish diagnostics on failure
        if: failure()
        run: |
          sudo --non-interactive /usr/local/sbin/cathsim-deploy-diagnostics \
            > "$RUNNER_TEMP/cathsim-deploy-diagnostics.txt"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cathsim-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/cathsim-deploy-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 14
