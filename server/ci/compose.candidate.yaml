name: cathsim-candidate

services:
  cathsim:
    image: "${CATHSIM_IMAGE:?CATHSIM_IMAGE is required}"
    pull_policy: never
    container_name: cathsim-candidate
    restart: "no"
    stop_grace_period: 30s
    gpus: all
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${CATHSIM_CANDIDATE_PORT:-19001}:9000"
    env_file:
      - /etc/cathsim/backend.env
    volumes:
      - "${CATHSIM_VPP_ASSETS_HOST:-/home/ps/cathsim-warp/data/vpp_assets}:/app/data/vpp_assets:ro"
    environment:
      CATHSIM_PORT: "9000"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      MUJOCO_GL: egl
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      NVIDIA_VISIBLE_DEVICES: all
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
