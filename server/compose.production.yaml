name: cathsim-server-production

services:
  cathsim-server:
    image: swr.cn-east-3.myhuaweicloud.com/siat/cathsim-server:v1.0
    pull_policy: always
    container_name: cathsim-server
    restart: unless-stopped
    stop_grace_period: 30s

    gpus: all
    shm_size: "2gb"
    pids_limit: 2048

    ports:
      - "19000:9000"

    environment:
      CATHSIM_PHYSICS_ENGINE: newton
      CATHSIM_VPP_DATA_ROOT: /app/data/vpp_assets
      CATHSIM_NEWTON_SUBSTEPS: "6"
      CATHSIM_NEWTON_ITERS: "2"
      CATHSIM_NEWTON_PUSH_SPEED: "0.05"
      CUDA_VISIBLE_DEVICES: "0"
      MUJOCO_GL: egl
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    volumes:
      - cathsim-cache:/home/cathsim/.cache
      - cathsim-logs:/app/reinforcement_learning/logs
      - cathsim-models:/app/reinforcement_learning/models
      - cathsim-runs:/app/reinforcement_learning/runs

    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:9000/api/v1/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  cathsim-cache:
  cathsim-logs:
  cathsim-models:
  cathsim-runs:
